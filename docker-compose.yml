services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile.backend
    env_file:
      - ./.env
    environment:
      - CHROMA_TELEMETRY=FALSE
      - ANONYMIZED_TELEMETRY=FALSE
    volumes:
      - focusai_sqlite:/data/sqlite
      - focusai_chroma:/data/chroma
      - focusai_uploads:/data/uploads
    ports:
      - "8000:8000"
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.frontend
    ports:
      - "8080:80"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  focusai_sqlite:
  focusai_chroma:
  focusai_uploads:
